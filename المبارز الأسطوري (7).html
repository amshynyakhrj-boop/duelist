<style>

#b2{background:#4da3ff !important;color:#04122a !important}
#b3{background:#7cff6b !important;color:#06240a !important}
#b4{background:#ff9a3c !important;color:#2a1200 !important}
#b5{background:#b06bff !important;color:#fff !important}
#co{width:100%;font-size:11px;color:#b8c4e0}
#ut{display:none;gap:8px;justify-content:center}

.pc{display:none;position:fixed;z-index:3}
.joy{bottom:calc(10px + var(--sa));width:var(--j);height:var(--j);border-radius:50%;border:2px solid #ffffff33;background:#ffffff0f}
.knob{position:absolute;left:28%;top:28%;width:44%;height:44%;border-radius:50%;background:#ffffff59;pointer-events:none}
.atk,.spb{border-radius:50%;align-items:center;justify-content:center;bottom:calc(22px + var(--sa))}
.atk{width:var(--a);height:var(--a);border:2px solid var(--or);background:#ff7a1a44;font-size:calc(var(--a)*.4)}

.spb{width:var(--s);height:var(--s);border:2px solid #ffd21a66;background:#ffd21a14;font-size:calc(var(--s)*.45);opacity:.6}
.spb.rdy{opacity:1;background:#ffd21aaa;box-shadow:0 0 18px #ffd21a}
#j1{left:calc(16px + env(safe-area-inset-left,0px))}#j2{right:calc(16px + env(safe-area-inset-right,0px))}

body.m2 #a2{right:calc(28px + var(--j) + env(safe-area-inset-right,0px))}
body.m2 #s2{right:calc(36px + var(--j) + var(--a) + env(safe-area-inset-right,0px))}
#ps{display:none;position:fixed;z-index:4;top:calc(4px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:34px;height:30px;border-radius:9px;border:1px solid #ffffff44;background:#ffffff1f;color:#fff;font-size:15px;align-items:center;justify-content:center}

#ov.lt{background:rgba(7,11,20,.72)}
#ov.home{background:radial-gradient(ellipse at 50% 42%,rgba(8,12,24,.1),rgba(3,6,14,.48) 66%,rgba(2,4,10,.78));justify-content:center;overflow:hidden}

#hm:before{content:"";position:absolute;inset:5px;border:1px solid #ffffff17;border-radius:19px;pointer-events:none;z-index:-1}
#brandline{font:900 clamp(9px,2vh,13px) system-ui,sans-serif;letter-spacing:clamp(2px,.8vw,5px);color:#ffca49;text-shadow:0 0 15px #ff9b1c99}

#hl{margin:0;font-size:clamp(30px,7.6vh,62px);font-weight:900;line-height:1.04;color:#fff;text-shadow:0 2px 0 #a8730a,0 5px 0 #6d3d12,0 9px 24px #000;letter-spacing:-1px}

#hs{font-size:clamp(11px,2.5vh,17px);color:#d6e0f5;font-weight:700}
#prof{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:clamp(10px,2vh,13px);font-weight:700;color:#e8eefc}
#pb{width:min(48vw,250px);height:7px;border-radius:6px;background:#ffffff26;overflow:hidden}
#homeActions{display:flex;gap:12px;align-items:stretch;justify-content:center;width:min(100%,450px);margin-top:4px}
#play,#homeShop{flex:1;min-width:0;font:900 clamp(17px,4.2vh,27px) Cairo,sans-serif;padding:clamp(8px,1.8vh,13px) 12px;border-radius:15px;border:1px solid #fff5;cursor:pointer;transition:transform .15s,filter .15s}
#play{background:linear-gradient(180deg,#fff17a 0%,#ffc21b 55%,#ed8211 100%);color:#251500;box-shadow:0 5px 0 #8b4d0c,0 0 24px #ffc21b45;animation:pulse 1.8s ease-in-out infinite;margin:0}

#setb{font:800 clamp(13px,2.8vh,18px) Cairo,sans-serif;padding:clamp(5px,1.1vh,8px) 22px;border-radius:12px;border:1px solid #ffffff44;background:linear-gradient(135deg,#ffffff1c,#ffffff08);color:#fff;min-width:min(52vw,250px);box-shadow:inset 0 1px #ffffff15}

.help{width:100%;font-size:12px;line-height:1.7;color:#b8c4e0;background:#ffffff0a;border-radius:10px;padding:8px;text-align:center}
#b6{background:#ffffff22 !important;color:#fff !important}

#prof{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:min(3.8vh,14px);font-weight:700;color:#e8eefc}

.cs b{font-size:15px}.cs span{font-size:10px;color:#b8c4e0;line-height:1.2}.cs i{font-style:normal;font-size:11px;color:#ffd21a}
